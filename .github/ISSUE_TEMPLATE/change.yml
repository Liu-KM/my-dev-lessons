name: Development goal
description: Describe an unresolved problem, expected outcome, and completion criteria.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What needs to change and why?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome / 期望结果
      description: What should become possible or improve? Leave undecided implementation choices open.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria / 完成判断
      description: What observable result will demonstrate completion?
    validations:
      required: true
