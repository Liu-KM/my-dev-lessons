name: Documentation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify documentation entry wiring
        run: python scripts/check_doc_entry.py

      - name: Run Python documentation checks
        run: python scripts/check_docs.py

      - name: Install type-exhaustiveness example dependencies
        run: python -m pip install -r examples/type-exhaustiveness/requirements.txt

      - name: Verify type-exhaustiveness cases
        run: python -m unittest discover -s examples/type-exhaustiveness -p 'test_*.py' -v

      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !ref/**
            !CLAUDE.md

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --exclude-path ref --exclude-path .git '**/*.md'
          fail: true
