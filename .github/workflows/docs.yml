name: Documentation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check lesson structure and checker regressions
        run: |
          python scripts/check_lessons.py
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check bilingual lesson consistency
        run: python scripts/check_lesson_pairs.py

      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !ref/**
            !CLAUDE.md

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --exclude-path ref --exclude-path .git '**/*.md'
          fail: true
