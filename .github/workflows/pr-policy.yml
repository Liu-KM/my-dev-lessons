name: PR policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to recheck after stack metadata changes
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Issue, labels and stack
    runs-on: ubuntu-latest
    steps:
      # Never run PR-head code under pull_request_target.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_pr_policy.py
