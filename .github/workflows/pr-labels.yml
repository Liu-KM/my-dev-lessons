name: Initialize PR labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const desired = JSON.parse(fs.readFileSync('.github/pr-labels.json', 'utf8'));
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, context.repo);
            const existing = new Set(labels.map(label => label.name));
            for (const [name, description] of Object.entries(desired)) {
              if (!existing.has(name)) {
                await github.rest.issues.createLabel({
                  ...context.repo, name, description,
                  color: name.startsWith('kind/') ? '1d76db' : '0e8a16'
                });
              }
            }
